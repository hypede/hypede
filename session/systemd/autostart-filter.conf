# Автозапуск программ (app-*@autostart.service, их создаёт systemd из
# .desktop-файлов в ~/.config/autostart и /etc/xdg/autostart).
# В сеансе HypeDE hypede-autostart-filter пропускает программы из списка
# dev.hypede.session disabled-autostart; в других сеансах ничего не меняет.
[Service]
ExecCondition=@LIBEXECDIR@/hypede-autostart-filter %N
