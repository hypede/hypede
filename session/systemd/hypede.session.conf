# Сеанс HypeDE: оболочка в режиме hypede и только нужные службы GNOME.
#
# Обычный сеанс GNOME подтягивает gnome-session-services.target — это ещё и
# индексатор файлов, центр обновлений, напоминания календаря, удалённый
# рабочий стол, смарт-карты… В HypeDE эти службы необязательные: включаются
# в «Настройки → Система → Службы» (см. hypede-session).
[Unit]
Requires=org.gnome.Shell@hypede.service
Wants=hypede-session.service

# Специальные возможности, раскладки, мультимедийные клавиши, питание,
# режим «в самолёте» — без них сеанс неполноценен.
Wants=org.gnome.SettingsDaemon.A11ySettings.target
Wants=org.gnome.SettingsDaemon.Keyboard.target
Wants=org.gnome.SettingsDaemon.MediaKeys.target
Wants=org.gnome.SettingsDaemon.Power.target
Wants=org.gnome.SettingsDaemon.Rfkill.target

# Ночной режим и цветовые профили, часовой пояс по местоположению,
# предупреждения о нехватке места, API хранителя экрана для приложений,
# звуковая тема.
Wants=org.gnome.SettingsDaemon.Color.target
Wants=org.gnome.SettingsDaemon.Datetime.target
Wants=org.gnome.SettingsDaemon.Housekeeping.target
Wants=org.gnome.SettingsDaemon.ScreensaverProxy.target
Wants=org.gnome.SettingsDaemon.Sound.target

# ssh-agent и перевод названий папок (Загрузки, Документы…) при смене языка.
Wants=gcr-ssh-agent.socket
Wants=user-dirs-update-gtk.service
