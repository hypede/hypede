<!--
  Одноцветный знак для панели. Рисуется в 16 пикселей, поэтому формы
  укрупнены и выровнены по сетке: тонкие детали на такой высоте превращаются
  в кашу.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <path fill="currentColor"
        d="M3 2h3v12H3zM10 2h3v12h-3zM6 7h4v2H6z"/>
</svg>
