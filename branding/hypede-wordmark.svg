<?xml version="1.0" encoding="UTF-8"?>
<!-- Знак вместе с названием — для заставки входа и документации. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9257ff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#plate)"/>
  <rect x="31" y="31" width="22" height="66" rx="7" fill="#ffffff"/>
  <rect x="75" y="31" width="22" height="66" rx="7" fill="#ffffff" opacity="0.82"/>
  <rect x="48" y="56" width="32" height="16" rx="6" fill="#ffffff"/>

  <!-- Двумя отдельными надписями, а не через tspan: часть отрисовщиков
       расставляет вложенные фрагменты по-своему, и название рассыпается. -->
  <text x="148" y="82"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="60" font-weight="700" fill="#f5f2ff">Hype</text>
  <text x="326" y="82"
        font-family="Inter, DejaVu Sans, sans-serif"
        font-size="60" font-weight="700" fill="#9257ff">DE</text>
</svg>
