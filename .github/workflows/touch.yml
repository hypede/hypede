name: HypeDE Touch

# Собирает HypeDE Touch — виртуальную машину UTM для Mac с Apple M1 и
# новее: пакет HypeDE, диск с Arch Linux ARM (tools/touch/build-image.sh)
# и папку .utm в zip. Из main (вручную или при правке tools/touch) образ
# выкладывается в релиз touch-latest, в остальных ветках — артефактом.

on:
  push:
    paths: ['tools/touch/**', '.github/workflows/touch.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: touch-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: menci/archlinuxarm:latest
  ZIP: HypeDE-Touch-aarch64.utm.zip

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache || true
      - name: Package
        run: docker run --rm -v "$PWD:/src" -w /src "$IMAGE" tools/repo/build.sh /src/repo
      - name: Disk image
        run: docker run --rm --privileged -v "$PWD:/src" -w /src "$IMAGE" tools/touch/build-image.sh /src/repo /src/image
      - name: UTM bundle
        run: |
          sudo chown -R "$(id -u):$(id -g)" image
          python3 tools/touch/make-utm.py image/disk.qcow2 "HypeDE Touch.utm"
          zip -r -1 "$ZIP" "HypeDE Touch.utm"
          ls -lh "$ZIP"
      - name: Upload artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hypede-touch
          path: ${{ env.ZIP }}
          retention-days: 3
          compression-level: 0
      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: touch-latest
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "HypeDE Touch (UTM, Apple M1+)" \
              --notes "Unzip and open HypeDE Touch.utm in UTM. User: hypede, password: hypede."
          gh release upload "$TAG" --clobber "$ZIP"
