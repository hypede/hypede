name: Theme store

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency: theme-store

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Theme:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools for checking files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gdkpixbuf-2.0 gstreamer1.0-plugins-base-apps clamav >/dev/null
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || true
      - name: Check and add the theme
        id: add
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 tools/store/add.py
      - name: Commit
        if: steps.add.outputs.added == 'true'
        run: |
          git config user.name "hypede-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/themes.json
          git commit -m "Theme store: add ${{ steps.add.outputs.repo }}"
          git push
      - name: Answer
        if: always() && steps.add.outputs.message != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.add.outputs.message }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
